<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoL 내전 전적 리더보드</title>
  <style>
    :root {
      --bg-dark: #111215;
      --bg-sidebar: #17181c;
      --bg-card: #1f2026;
      --bg-hover: #292a33;
      --border-color: #2e303b;
      --text-main: #f0f2f5;
      --text-sub: #8e9297;
      --point-color: #e5a93c;
      --point-hover: #f5b94e;
      --win-color: #4ade80;
      --loss-color: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

    aside {
      width: 250px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo-area {
      padding: 24px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--point-color);
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border-color);
    }
    .nav-links { list-style: none; padding: 15px 0; }
    .nav-links li {
      padding: 14px 24px;
      cursor: pointer;
      color: var(--point-color);
      background-color: rgba(229, 169, 60, 0.08);
      border-left: 4px solid var(--point-color);
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .sidebar-footer { padding: 20px; border-top: 1px solid var(--border-color); }
    .btn-sheet {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      text-decoration: none;
      display: block;
      text-align: center;
      transition: all 0.2s;
    }
    .btn-sheet:hover { background: var(--bg-hover); border-color: var(--point-color); }

    main { flex: 1; padding: 30px 40px; overflow-y: auto; }
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }
    .section-title { font-size: 1.5rem; font-weight: 700; color: var(--text-main); }
    .header-actions { display: flex; gap: 12px; align-items: center; }
    .search-box input {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 10px 16px;
      border-radius: 6px;
      color: var(--text-main);
      width: 220px;
      outline: none;
    }
    .search-box input:focus { border-color: var(--point-color); }

    .btn-refresh {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-refresh:hover { border-color: var(--point-color); }

    .table-container {
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th, td { padding: 14px 20px; border-bottom: 1px solid var(--border-color); }
    th { background: #191a20; color: var(--text-sub); font-weight: 600; cursor: pointer; user-select: none; }
    th:hover { color: var(--text-main); }
    tr:hover td { background-color: var(--bg-hover); }

    .tier-badge { font-weight: bold; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; }
    .tier-SS { color: #f59e0b; background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; }
    .tier-S { color: #ec4899; background: rgba(236, 72, 153, 0.15); }
    .tier-A { color: #8b5cf6; background: rgba(139, 92, 246, 0.15); }
    .tier-B { color: #3b82f6; background: rgba(59, 130, 246, 0.15); }
    .tier-C { color: #10b981; background: rgba(16, 185, 129, 0.15); }
    .tier-D { color: #6b7280; background: rgba(107, 114, 128, 0.15); }

    .winrate-high { color: var(--win-color); font-weight: bold; }
    .winrate-mid { color: var(--point-color); }
    .winrate-low { color: var(--loss-color); }

    .status-msg { padding: 40px; text-align: center; color: var(--text-sub); font-size: 1rem; }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="logo-area">
        <span>⚔️</span> LoL 내전 매니저
      </div>
      <ul class="nav-links">
        <li>🏆 개인 기록 (Leaderboard)</li>
      </ul>
    </div>
    <div class="sidebar-footer">
      <!-- 구글 시트 편집 링크를 걸어둘 수 있습니다 -->
      <a href="#" id="sheetEditLink" target="_blank" class="btn-sheet">📊 구글 시트에서 수정하기</a>
    </div>
  </aside>

  <main>
    <div class="section-header">
      <div class="section-title">개인 기록 (Leaderboard)</div>
      <div class="header-actions">
        <button class="btn-refresh" onclick="fetchSheetData()">🔄 새로고침</button>
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="선수 검색..." onkeyup="renderLeaderboard()" />
        </div>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th onclick="sortTable('name')">선수</th>
            <th onclick="sortTable('tier')">내부 티어 ⬍</th>
            <th onclick="sortTable('position')">주 포지션</th>
            <th onclick="sortTable('games')">총 게임 ⬍</th>
            <th onclick="sortTable('wins')">승리 ⬍</th>
            <th onclick="sortTable('winRate')">승률 ⬍</th>
            <th>체감 특징 및 코멘트</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr><td colspan="7" class="status-msg">구글 스프레드시트 데이터를 불러오는 중...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // ==========================================
    // ★ 여기에 구글 시트 [웹에 게시] CSV 링크를 넣으세요!
    // ==========================================
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTD-8LQeTnApUwtihtMMrW_FI9u0ZfXQukMA4oZpCtcAmA7vFncTA7S7NnNywgqmH6gV7cvyK5S8fFa/pub?output=csv";

    let players = [];
    let sortColumn = 'tier';
    let sortAsc = false;
    const tierWeights = { "SS": 6, "S": 5, "A": 4, "B": 3, "C": 2, "D": 1 };

    // 간단한 CSV 파서
    function parseCSV(text) {
      const lines = text.trim().split("\n");
      if (lines.length < 2) return [];

      const result = [];
      for (let i = 1; i < lines.length; i++) {
        // 쉼표 분리 (따옴표 처리)
        const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(v => v.replace(/^"\vert{}"$/g, '').trim());
        if (row.length >= 5 && row[0]) {
          const games = parseInt(row[3]) || 0;
          const wins = parseInt(row[4]) || 0;
          result.push({
            name: row[0],
            tier: row[1] || 'B',
            position: row[2] || 'MID',
            games: games,
            wins: wins,
            winRate: games > 0 ? (wins / games) : 0,
            notes: row[5] || '-'
          });
        }
      }
      return result;
    }

    // 구글 시트에서 실시간 데이터 받아오기
    async function fetchSheetData() {
      const tbody = document.getElementById("leaderboardBody");
      tbody.innerHTML = `<tr><td colspan="7" class="status-msg">구글 시트에서 최신 전적을 받아오는 중입니다...</td></tr>`;

      if (GOOGLE_SHEET_CSV_URL.includes("여기에_복사한")) {
        tbody.innerHTML = `<tr><td colspan="7" class="status-msg" style="color:var(--loss-color);">
          ⚠️ 코드 상단의 GOOGLE_SHEET_CSV_URL 변수에 구글 시트 CSV 링크를 먼저 입력해주세요!
        </td></tr>`;
        return;
      }

      try {
        // 캐시 방지를 위해 타임스탬프 쿼리 추가
        const response = await fetch(GOOGLE_SHEET_CSV_URL + "&t=" + new Date().getTime());
        const csvText = await response.text();
        players = parseCSV(csvText);
        renderLeaderboard();
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="7" class="status-msg" style="color:var(--loss-color);">
          데이터를 불러오지 못했습니다. 구글 시트가 '웹에 게시' 상태인지 확인해주세요.
        </td></tr>`;
      }
    }

    function renderLeaderboard() {
      const tbody = document.getElementById("leaderboardBody");
      const search = document.getElementById("searchInput").value.toLowerCase();
      tbody.innerHTML = "";

      let filtered = players.filter(p => p.name.toLowerCase().includes(search));

      filtered.sort((a, b) => {
        let valA = a[sortColumn];
        let valB = b[sortColumn];

        if (sortColumn === 'tier') {
          valA = tierWeights[a.tier] || 0;
          valB = tierWeights[b.tier] || 0;
        }

        if (valA < valB) return sortAsc ? -1 : 1;
        if (valA > valB) return sortAsc ? 1 : -1;
        return 0;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="status-msg">표시할 선수 데이터가 없습니다.</td></tr>`;
        return;
      }

      filtered.forEach(p => {
        const winPercent = Math.round(p.winRate * 100);
        const winRateClass = winPercent >= 60 ? 'winrate-high' : winPercent >= 45 ? 'winrate-mid' : 'winrate-low';

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${p.name}</strong></td>
          <td><span class="tier-badge tier-${p.tier}">${p.tier}</span></td>
          <td>${p.position}</td>
          <td>${p.games}</td>
          <td>${p.wins}</td>
          <td class="${winRateClass}">${winPercent}%</td>
          <td style="color:var(--text-sub);">${p.notes}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function sortTable(col) {
      if (sortColumn === col) sortAsc = !sortAsc;
      else { sortColumn = col; sortAsc = false; }
      renderLeaderboard();
    }

    // 페이지 접속 시 자동 로드
    fetchSheetData();
  </script>
</body>
</html>
